# Data-free checks on every push and pull request to v2 (REVIEW.md, adopted 2026-11-08). Most of the suite reads the cluster's
# archive and runs on the cluster before a merge; these steps need only the code: every module compiles, imports have no side
# effects, and the data-free test files pass. (tests/test_refactor_shims.py compares imports with a baseline recorded in the cluster's
# py38_orca_nkosogor environment, so it runs on the cluster, not here.)
name: tests
on:
  push:
    branches: [v2]
  pull_request:
    branches: [v2]
permissions:
  contents: read
jobs:
  data-free:
    # pinned (2026-11-11): ubuntu-latest moved to Ubuntu 26.04, for which setup-python has no Python 3.8 build (the job failed
    # at set-up, before any test); 24.04 is the newest image with one. Move both together when the cluster environment moves.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.8'
      - name: dependencies (the cluster environment's versions)
        run: pip install numpy==1.24.4 scipy==1.10.1 astropy==5.2.2 matplotlib==3.7.2 pandas==2.0.3 reproject==0.13.0 astropy-healpix==0.7 pyyaml==6.0.1 psutil==5.9.5 pytest
      - name: every module compiles
        run: python -m compileall -q exopipe
      - name: imports have no side effects
        run: python tests/test_import_side_effects.py
      - name: wideband admission
        run: python tests/test_masters_wideband_admission.py
      - name: 10-minute residual of a night that is not in the window Masters
        run: python tests/test_sublst_nonmember.py
      - name: exclusion read scopes (default, snapshot tiers per night)
        run: python tests/test_exclusion_scope.py
      - name: 10-minute x2-aligned residual of a night that is not in the window Masters
        run: python tests/test_sublst_refine_nonmember.py
      - name: R1 epoch header gate
        run: python tests/test_r1_epoch_header_gate.py
      - name: grammar sync with production
        run: python tests/test_products_grammar_sync.py
      - name: search engine speed-ups change no product
        run: python tests/test_search_speedups.py
      - name: Phase 2 speed-ups change no product
        run: python tests/test_phase2_speedups.py
      - name: snapshot engine speed-ups change no product
        run: python tests/test_snapshot_engine.py
      - name: snapshot cell scheduler and driver plan
        run: python tests/test_snapshot_schedule.py && python tests/test_snapshot_cell.py
      - name: the hour's one email (Phase 2 report rebuilt, highlights block, table readers)
        run: python tests/test_email.py
      - name: per-hour 10-minute search seed (size-rule record, table record, header gate)
        run: python tests/test_search_sublst_perhour_seed.py
