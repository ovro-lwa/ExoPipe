# Data-free checks on every push and pull request to v2 (REVIEW.md, adopted 2026-11-08). Most of the suite reads the cluster's
# archive and runs on the cluster before a merge; these steps need only the code: every module compiles, imports have no side
# effects, and the data-free test files pass. (tests/test_refactor_shims.py compares imports with a baseline recorded in the cluster's
# py38_orca_nkosogor environment, so it runs on the cluster, not here.)
name: tests
on:
  push:
    branches: [v2]
  pull_request:
    branches: [v2]
permissions:
  contents: read
jobs:
  data-free:
    # pinned (2026-11-11): ubuntu-latest moved to Ubuntu 26.04, for which setup-python has no Python 3.8 build (the job failed
    # at set-up, before any test); 24.04 is the newest image with one. Move both together when the cluster environment moves.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.8'
      - name: dependencies (the cluster environment's versions)
        run: pip install numpy==1.24.4 scipy==1.10.1 astropy==5.2.2 matplotlib==3.7.2 pandas==2.0.3 reproject==0.13.0 astropy-healpix==0.7 pyyaml==6.0.1 psutil==5.9.5 pytest
      - name: every module compiles
        run: python -m compileall -q exopipe
      - name: imports have no side effects
        run: python tests/test_import_side_effects.py
      - name: wideband admission
        run: python tests/test_masters_wideband_admission.py
      - name: 10-minute residual of a night that is not in the window Masters
        run: python tests/test_sublst_nonmember.py
      - name: exclusion read scopes (default, snapshot tiers per night)
        run: python tests/test_exclusion_scope.py
      - name: 10-minute x2-aligned residual of a night that is not in the window Masters
        run: python tests/test_sublst_refine_nonmember.py
      - name: 10-minute tree entry of a night that is not in the window Masters
        run: python tests/test_sublst_tree_nonmember.py
      - name: 10-minute wideband of one night that is not in the window Masters (arm-A evidence)
        run: python tests/test_sublst_wideband_perhour.py
      - name: 10-minute catalog of one night in the per-hour chain (the frozen-state gate, the item's refusals, pages of the night)
        run: python tests/test_catalog_incremental_sublst.py
      - name: R1 epoch header gate
        run: python tests/test_r1_epoch_header_gate.py
      - name: no memory maps (R-GREGG-20261117-NO-MMAP-OF-LUSTRE-FILES-READ-OR-WRITE)
        run: python tests/test_no_mmap.py
      - name: safe copies (shutil copies read and write; a short copy is refused)
        run: python tests/test_no_sendfile.py
      - name: placement keeps the product's group and ACL (core/placement.py; a rename from elsewhere, a copy2 source's ACL; refusals)
        run: python tests/test_placement.py
      - name: the parity guard's astropy hook composes with the sub-LST frozen-code guard (no import recursion)
        run: python tests/test_guard_reentry.py
      - name: SIGTERM interrupts only the step's own process (forked pool workers take the default action)
        run: python tests/test_cli_sigterm_children.py
      - name: grammar sync with production
        run: python tests/test_products_grammar_sync.py
      - name: Header validator on HEALPix maps and images (decision C-08)
        run: python tests/test_validate_healpix.py
      - name: cutout-generation campaigns (unit list, code pin, space gate, I/O guard, stage-1 readiness and no-wideband, complete-when check)
        run: python tests/test_photometry_campaign.py
      - name: stamp engine of ad hoc 10-s cutouts (helpers, gates on a stub code root)
        run: python tests/test_stamp_engine.py
      - name: 10-s cutouts writer safety (fsync and header-implied size, engine counts, exclusion before the engine, durable records)
        run: python tests/test_photometry_writer_safety.py
      - name: photometry flux-scale gate (rescaled-cube gate, wideband member gate, flux-scale record, checks a b c w, generation-5 sample)
        run: python tests/test_photometry_cube_gate.py
      - name: hybrid route PR-1 (config sections, unit plan, stage gates, token-card rule, CLI skeleton refusals)
        run: python tests/test_hybrid_config.py
      - name: parent-catalog union (one config value for the current union; MANIFEST.md5 digest gate M1-M4; hybrid recon reader)
        run: python tests/test_parent_union_gate.py
      - name: hybrid route PR-2 (stack stage - rebuild test, offsets, hybrid filter, membership, Phase 1 choice, unit items, content tests)
        run: python tests/test_hybrid_stack.py
      - name: hybrid route PR-3 (recon + wideband - config constants, record content tests, convergence cascade, refusals)
        run: python tests/test_hybrid_recon.py
      - name: hybrid route PR-4 (hybrid + full - config constants, record and product content tests, the unit's refusals and refused items)
        run: python tests/test_hybrid_master.py
      - name: hybrid route PR-5 (tilefill - config constants, identity and compact checks, record and card content tests, sources and plan)
        run: python tests/test_hybrid_tilefill.py
      - name: hybrid route PR-5b (archive push --class hybrid - keep, publish, replace, retire via the round quarantine; gates; diffuse PB writer)
        run: python tests/test_archive_hybrid.py
      - name: hybrid route PR-7a (mosaic --generation v5 - stage, coadd, caveat, fill, render units; tile and fill content tests; tilefill --mosaic-out)
        run: python tests/test_mosaic_v5.py
      - name: hybrid route PR-6b (mosaic --generation v3 - stage, coadd, render of the plain, striation-corrected and Stokes V jobs; tile tests)
        run: python tests/test_mosaic_v3.py
      - name: hybrid route PR-7d, PR-6e (archive push --class mosaic_v5, mosaic_v3 - keep, publish, replace via the round quarantine; gates)
        run: python tests/test_archive_mosaic_v5.py && python tests/test_archive_mosaic_v3.py
      - name: hybrid route PR-8 (run update - trigger closure, items, UPDATE_ORDER, every step command parses, plan output)
        run: python tests/test_update_plan.py
      - name: search engine speed-ups change no product
        run: python tests/test_search_speedups.py
      - name: Phase 2 speed-ups change no product
        run: python tests/test_phase2_speedups.py
      - name: snapshot engine speed-ups change no product
        run: python tests/test_snapshot_engine.py
      - name: snapshot cell scheduler and driver plan
        run: python tests/test_snapshot_schedule.py && python tests/test_snapshot_cell.py
      - name: the hour's one email (Phase 2 report rebuilt, highlights block, table readers)
        run: python tests/test_email.py
      - name: per-hour 10-minute search seed (size-rule record, table record, header gate)
        run: python tests/test_search_sublst_perhour_seed.py
      - name: 10-minute frozen gate populations and the admission of a night outside the window Masters
        run: python tests/test_search_gate_population_tenmin.py
      - name: per-hour 10-minute catalog, the conformance table's noise recorded or frozen
        run: python tests/test_catalog_conform_noise.py
      - name: per-hour 10-minute catalog, the night view of the published search jobs and the night pass's wiring
        run: python tests/test_catalog_night_view.py
      - name: follow-up 10-s light curve reads the search's frames and honors exclusion
        run: python tests/test_followup_snapshot_frames.py
      - name: TESS orbit table refresh step (content checks, refusals keep the table, complete only 14 days ahead)
        run: python tests/test_tess_orbits.py
      - name: per-cell refusals in a runner chain (the per-hour chain goes on past a refused cell; complete with N refused cells)
        run: python tests/test_runner_cell_refusal.py
      - name: the frames-only engine refuses a 10-minute append (gate FE-10MIN-APPEND)
        run: python tests/test_frames_tenmin_append_gate.py
